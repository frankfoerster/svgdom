name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check package entry points and fonts
        run: npm run test:package

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  svg-js-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out svgdom
        uses: actions/checkout@v6
        with:
          path: svgdom

      - name: Check out svg.js 3.2.7
        uses: actions/checkout@v6
        with:
          repository: svgdotjs/svg.js
          ref: 7e06420e056de92c4839f03b4406605850b04168
          path: svg.js

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install svgdom dependencies
        run: npm ci
        working-directory: svgdom

      - name: Build svgdom
        run: npm run build
        working-directory: svgdom

      # The pinned upstream checkout has no npm lockfile.
      - name: Install svg.js dependencies
        run: npm install --package-lock=false
        working-directory: svg.js

      - name: Link the checked-out svgdom into svg.js
        run: |
          rm -rf node_modules/svgdom
          ln -s "$GITHUB_WORKSPACE/svgdom" node_modules/svgdom
        working-directory: svg.js

      - name: Test svg.js with svgdom
        run: npm run test:svgdom
        working-directory: svg.js
